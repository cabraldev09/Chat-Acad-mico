name: chat-academico-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whaticket
      POSTGRES_USER: whaticket
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whaticket"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: whaticket
      DB_USER: whaticket
      DB_PASS: ${DB_PASS:?Defina DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /data/public
      WWEBJS_AUTH_PATH: /data/wwebjs
      ZAPO_AUTH_PATH: /data/zapo/state.sqlite
    volumes:
      - media-data:/data
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:80"]
    environment:
      URL_BACKEND: backend:8080
      VITE_BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      REACT_APP_BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
    depends_on: [backend]
volumes:
  postgres-data:
  media-data:
