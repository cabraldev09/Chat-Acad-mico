name: Verificações

on:
  push:
    branches: [main]
  pull_request:

env:
  # Build/unit jobs skip the browser download; integration locates Chrome or installs it explicitly.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend compila
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit
      - name: Regressões da IA e segurança
        working-directory: backend
        run: |
          npm run test:ai
          npm run test:security
      - name: Bloqueio de publicação
        run: node --test deploy/vps/check-ci.test.js
      - name: Tudo em português
        working-directory: backend
        run: node scripts/i18n-check.js
      - name: Frontend compila
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx vite build
      - name: Frontend sem variáveis inexistentes (evita tela branca)
        working-directory: frontend
        run: >
          npx eslint --no-eslintrc --parser-options=ecmaVersion:2021 --parser-options=sourceType:module
          --parser-options=ecmaFeatures:{jsx:true} --env browser,es2021 --plugin react --plugin react-hooks
          --rule 'no-undef:error' --rule 'react/jsx-no-undef:error' --rule 'react/jsx-uses-vars:error'
          --rule 'react/jsx-uses-react:error' src

  integracao:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências reproduzíveis
        working-directory: backend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Canais, permissões, pagamentos e continuidade
        working-directory: backend
        env:
          PGUSER: postgres
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          else
            npx puppeteer browsers install chrome
            export CHROME_BIN="$(node -p "require('puppeteer').executablePath()")"
          fi
          npm run test:channels
