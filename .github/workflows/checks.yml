name: Verificações

on:
  push:
    branches: [main]
  pull_request:

# a new push to the same pull request replaces the run that is still going (nobody waits for an old commit)
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build/unit jobs skip the browser download; integration locates Chrome or installs it explicitly.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend compila
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit
      - name: Regressões da IA e segurança
        working-directory: backend
        run: |
          npm run test:ai
          npm run test:security
      - name: Bloqueio de publicação
        run: node --test deploy/vps/check-ci.test.js deploy/vps/check-label.test.js
      - name: Tudo em português
        working-directory: backend
        run: node scripts/i18n-check.js
      - name: Rotas por perfil (auditoria)
        working-directory: backend
        run: node scripts/audit-routes.js
      - name: Testes de unidade (motor de análise, proposta, e-mails)
        working-directory: backend
        run: npx vitest run
      - name: Frontend compila
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx vite build
      - name: Testes de componentes do frontend
        working-directory: frontend
        run: |
          # instaladas só aqui, sem mudar o package-lock (o pacote xlsx vem de um endereço próprio)
          npm install --no-save --legacy-peer-deps --no-audit --no-fund vitest@3.2.4 jsdom@26.1.0 @testing-library/react@12.1.5
          npx vitest run
      - name: Frontend sem leitura tardia de evento (erro "reading 'value'" no React 16)
        working-directory: frontend
        run: node scripts/check-lazy-events.js
      - name: Menu sem ícones repetidos
        working-directory: frontend
        run: node scripts/check-menu-icons.js
      - name: Sem caixas do navegador (confirm, alert, prompt)
        working-directory: frontend
        run: node scripts/check-native-dialogs.js
      - name: Avisos somem sozinhos
        working-directory: frontend
        run: node scripts/check-toast-timer.js
      - name: Frontend sem variáveis inexistentes (evita tela branca)
        working-directory: frontend
        run: >
          npx eslint --no-eslintrc --parser-options=ecmaVersion:2021 --parser-options=sourceType:module
          --parser-options=ecmaFeatures:{jsx:true} --env browser,es2021 --plugin react --plugin react-hooks
          --rule 'no-undef:error' --rule 'react/jsx-no-undef:error' --rule 'react/jsx-uses-vars:error'
          --rule 'react/jsx-uses-react:error' src

  # a API inteira (WhatsApp/Telegram/Efí simulados) num banco descartável
  # three independent suites, run side by side (each in its own job and database), so the wait is the longest one, not the sum
  api-ponta-a-ponta:
    name: api-ponta-a-ponta (${{ matrix.nome }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: canais e conversas
            script: channels-e2e.js
          - nome: responsabilidade pela conversa
            script: assign-e2e.js
          - nome: estatísticas e gestão comercial
            script: analytics-e2e.js
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGUSER: postgres
      PGHOST: localhost
      CHROME_BIN: /usr/bin/google-chrome
      CHROME_ARGS: "--no-sandbox --disable-setuid-sandbox"
      LOGIN_RATE_MAX: "100"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instala e compila o backend
        working-directory: backend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Cliente PostgreSQL da mesma versão do serviço
        if: matrix.script == 'channels-e2e.js'
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          client_dir="$RUNNER_TEMP/postgres-client"
          mkdir -p "$client_dir"
          cat > "$client_dir/psql" <<'CLIENT'
          #!/usr/bin/env bash
          exec docker exec -i "$PG_TEST_CONTAINER" "$(basename "$0")" "$@"
          CLIENT
          cp "$client_dir/psql" "$client_dir/pg_dump"
          cp "$client_dir/psql" "$client_dir/pg_restore"
          chmod +x "$client_dir/psql" "$client_dir/pg_dump" "$client_dir/pg_restore"
          echo "PG_BIN=$client_dir" >> "$GITHUB_ENV"
          echo "PG_TEST_CONTAINER=$PG_TEST_CONTAINER" >> "$GITHUB_ENV"
      - name: Testes de ponta a ponta (${{ matrix.nome }})
        working-directory: backend
        env:
          # o log completo da API de teste fica guardado quando o job falha (dados fictícios): falha que não repete deixa evidência
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: node scripts/${{ matrix.script }}
      - name: Guarda o log da API quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-api-${{ matrix.script }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 3
          if-no-files-found: ignore

  # todas as telas, como os seis perfis, digitando nos formulários e repetindo a varredura em 390×844
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGUSER: postgres
      CHROME_BIN: /usr/bin/google-chrome
      DB_DIALECT: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: ""
      DB_NAME: telas
      DB_SSL: "false"
      DATABASE_URL: ""
      DATABASE_URL_POOL: ""
      JWT_SECRET: ci
      JWT_REFRESH_SECRET: ci-r
      PORT: "8080"
      BACKEND_URL: http://localhost
      PUBLIC_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:3000
      SKIP_WHATSAPP_SESSIONS: "1"
      SKIP_DEFAULT_DATA: "1"
      LOG_LEVEL: warn
      LOGIN_RATE_MAX: "1000"
      VITE_BACKEND_URL: http://localhost:8080/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend no ar (banco novo, migrado e com os dados iniciais)
        working-directory: backend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          psql -h localhost -U postgres -c "CREATE DATABASE telas"
          npx sequelize db:migrate
          # the known administrator of the tests is only created when NODE_ENV is "test" (a real installation never gets it)
          NODE_ENV=test npx sequelize db:seed:all
          ALLOW_SWEEP=1 nohup node dist/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
      - name: Frontend (build de produção) no ar
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx vite build
          nohup npx vite preview --port 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/ > /dev/null && break; sleep 2; done
      - name: Varredura das rotas (todas as GET como admin, consultor e tutor)
        working-directory: backend
        env:
          API: http://localhost:8080
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: telas
        run: node scripts/route-sweep.js
      - name: Varredura das telas
        working-directory: frontend
        env:
          BASE: http://localhost:3000
          API: http://localhost:8080
          REPORT: /tmp/telas.txt
        run: node scripts/smoke-pages.js admin coordenacao consultor tutor academico relacionamento
      - name: Relatório da varredura e registro da API
        if: always()
        run: |
          echo "--- relatório ---"; cat /tmp/telas.txt || true
          echo "--- API (fim) ---"; tail -40 /tmp/api.log || true


