name: Deploy da API no Railway
# Alternativa ao gatilho do GitHub app: envia o código com a CLI do Railway.
# Segredos necessários (Settings > Secrets > Actions): RAILWAY_TOKEN e RAILWAY_SERVICE.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Verificações"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.RAILWAY_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir testes da revisão selecionada
        run: node deploy/vps/check-ci.js "${{ github.event.workflow_run.head_sha || github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: npm install -g @railway/cli
      - run: railway up --service "$RAILWAY_SERVICE" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
