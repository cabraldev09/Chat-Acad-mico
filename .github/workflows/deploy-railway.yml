name: Deploy da API no Railway
# Alternativa ao gatilho do GitHub app: envia o código com a CLI do Railway.
# Segredos necessários (Settings > Secrets > Actions): RAILWAY_TOKEN e RAILWAY_SERVICE.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "Dockerfile", "railway.toml", ".github/workflows/deploy-railway.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.RAILWAY_DEPLOY == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @railway/cli
      - run: railway up --service "$RAILWAY_SERVICE" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
