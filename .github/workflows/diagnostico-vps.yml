name: Diagnóstico da VPS (somente leitura)

# Lê o estado da VPS sem alterar nada: versão no ar, contêineres, pastas das sessões do WhatsApp no volume e as linhas de log de sessão/autenticação.
# Roda só quando alguém clica em "Run workflow". Usa a mesma chave de deploy (VPS_SSH_KEY) e a identidade do servidor de deploy/vps/known_hosts.
on:
  workflow_dispatch:

jobs:
  ler:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 209.145.48.49
    steps:
      - uses: actions/checkout@v4
      - name: Prepara o SSH e confere a identidade do servidor
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          body=$(printf '%s' "$KEY" | grep -v '^-----' | tr -d ' \r\n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s' "$body" | fold -w 70; echo; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          grep -v '^#' deploy/vps/known_hosts > ~/.ssh/known_hosts
          want=$(awk '{print $3}' ~/.ssh/known_hosts)
          seen=$(ssh-keyscan -T 15 -t ed25519 "$VPS_HOST" 2>/dev/null | awk '{print $3}')
          [ -n "$seen" ] && [ "$seen" = "$want" ] || { echo "::error::A chave do servidor não confere"; exit 1; }
      - name: Lê a VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@"$VPS_HOST" 'bash -s' <<'REMOTE'
          cd /opt/chat-academico
          echo "== versão no ar =="; git log -1 --format='%h %ci %s'
          echo "== contêineres =="; docker ps --format '{{.Names}} {{.Status}}'
          echo "== .env: caminhos das sessões (só os nomes e valores de caminho) =="; grep -E '^(WWEBJS_AUTH_PATH|UPLOAD_DIR|WHATSAPP_PROVIDER|WHATSAPP_MAX_QR)=' deploy/vps/.env || echo "(nenhum)"
          echo "== dentro do contêiner: variáveis =="; docker exec chat-academico-api-1 sh -c 'echo WWEBJS_AUTH_PATH=$WWEBJS_AUTH_PATH; id; ls -ld /data /data/wwebjs 2>&1; echo; ls -la /data/wwebjs 2>&1 | head -20; echo; for d in /data/wwebjs/session-*; do echo "$d: $(ls $d 2>/dev/null | head -5 | tr "\n" " ") | Default: $(ls $d/Default 2>/dev/null | wc -l) arquivos"; done' 2>&1
          echo "== backups das sessões e do banco (/opt/backups) =="; ls -la --time-style=long-iso /opt/backups 2>&1 | tail -20
          echo "== o que há dentro do backup de dados mais recente (só as pastas das sessões) =="; f=$(ls -1t /opt/backups/dados-*.tar.gz 2>/dev/null | head -1); echo "arquivo: $f"; [ -n "$f" ] && tar tzf "$f" 2>/dev/null | grep -E "^(\./)?wwebjs/session-bd_[0-9]+/?$" | head -10
          echo "== conexões no banco (id, nome, estado) =="; docker exec chat-academico-api-1 node -e "const {Client}=require('pg');" >/dev/null 2>&1; docker logs --since 6h chat-academico-api-1 2>&1 | grep -E "Starting WhatsApp session" | cut -c1-200 | tail -4
          echo "== disco =="; df -h / /var/lib/docker 2>/dev/null | head -5; docker system df 2>/dev/null | head -6
          echo "== memória =="; free -m | head -3
          echo "== sessões do WhatsApp nos logs (últimas 80 linhas relevantes) =="; docker logs --since 3h chat-academico-api-1 2>&1 | grep -i -E "Session[: ]|session-|AUTHENTICATED|READY|QR|auth_failure|Disconnected|disconnect|watchdog|heartbeat|não abriu|não ficou pronta|TIMEOUT|status estava desatualizado|corrigido" | cut -c1-260 | tail -80
          echo "== erros recentes =="; docker logs --since 3h chat-academico-api-1 2>&1 | grep -i -E '"level":(50|60)|ERROR|FATAL' | cut -c1-220 | tail -15
          REMOTE
