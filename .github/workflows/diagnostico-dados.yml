name: Diagnóstico dos dados de leads e tarefas (somente leitura)

# Mostra, sem alterar nada, quem é o responsável de cada lead novo e de cada tarefa em aberto (dono do lead, dono da conversa, dono da conexão do WhatsApp).
on:
  workflow_dispatch:

jobs:
  ler:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 209.145.48.49
    steps:
      - uses: actions/checkout@v4
      - name: Prepara o SSH e confere a identidade do servidor
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          body=$(printf '%s' "$KEY" | grep -v '^-----' | tr -d ' \r\n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s' "$body" | fold -w 70; echo; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          grep -v '^#' deploy/vps/known_hosts > ~/.ssh/known_hosts
          want=$(awk '{print $3}' ~/.ssh/known_hosts)
          seen=$(ssh-keyscan -T 15 -t ed25519 "$VPS_HOST" 2>/dev/null | awk '{print $3}')
          [ -n "$seen" ] && [ "$seen" = "$want" ] || { echo "::error::A chave do servidor não confere"; exit 1; }
      - name: Consulta
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes backend/scripts/diag-dados.js root@"$VPS_HOST":/tmp/diag-dados.js
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$VPS_HOST" 'docker cp /tmp/diag-dados.js chat-academico-api-1:/app/backend/diag-dados.js && docker exec chat-academico-api-1 node /app/backend/diag-dados.js; docker exec chat-academico-api-1 rm -f /app/backend/diag-dados.js'

      - name: Logs do WhatsApp (pilha completa do navegador, READY, mensagens)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$VPS_HOST" 'docker logs --since 90m chat-academico-api-1 2>&1 | grep -E "Media|media|READY|Session|Starting WhatsApp|heartbeat|inject|inje|health|waiting for|Waiting failed|ProtocolError|Execution context|Target closed|message_create|Evaluation failed|watchdog|caught up|syncing|Error on whatsapp|Error sync|recuper" | cut -c1-700 | tail -40; echo "== pilha completa do primeiro TimeoutError =="; docker logs --since 90m chat-academico-api-1 2>&1 | grep -m1 -A22 "Waiting failed" | cut -c1-400; echo "== versao do whatsapp-web.js e do navegador =="; docker exec chat-academico-api-1 sh -c "grep -m1 \"\\\"version\\\"\" node_modules/whatsapp-web.js/package.json; chromium --version 2>/dev/null || chromium-browser --version 2>/dev/null"'
