name: Diagnóstico dos dados de leads e tarefas (somente leitura)

# Mostra, sem alterar nada, quem é o responsável de cada lead novo e de cada tarefa em aberto (dono do lead, dono da conversa, dono da conexão do WhatsApp).
on:
  workflow_dispatch:
    inputs:
      secao:
        description: "O que ler: as contagens, o catálogo de cursos, ou os logs do WhatsApp (os logs podem ter números: o repositório é público)"
        type: choice
        options: [tudo, cursos, logs, erros]
        default: tudo

jobs:
  ler:
    runs-on: ubuntu-latest
    env:
      # the server's address is the first column of deploy/vps/known_hosts (changing server = changing that one line)
      VPS_KNOWN_HOSTS: deploy/vps/known_hosts
    steps:
      - uses: actions/checkout@v4
      - name: Prepara o SSH e confere a identidade do servidor
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          VPS_HOST=$(grep -v '^#' "$VPS_KNOWN_HOSTS" | awk 'NF{print $1; exit}'); echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          body=$(printf '%s' "$KEY" | grep -v '^-----' | tr -d ' \r\n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s' "$body" | fold -w 70; echo; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          grep -v '^#' deploy/vps/known_hosts > ~/.ssh/known_hosts
          want=$(awk '{print $3}' ~/.ssh/known_hosts)
          seen=$(ssh-keyscan -T 15 -t ed25519 "$VPS_HOST" 2>/dev/null | awk '$2=="ssh-ed25519"{print $3}')
          [ -n "$seen" ] && [ "$seen" = "$want" ] || { echo "::error::A chave do servidor não confere"; exit 1; }
      - name: Catálogo de cursos (nome, grau, formato, ativo; nenhum dado de pessoa)
        if: ${{ inputs.secao == 'cursos' }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes backend/scripts/diag-cursos.js root@"$VPS_HOST":/tmp/diag-cursos.js
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$VPS_HOST" 'docker cp /tmp/diag-cursos.js chat-academico-api-1:/app/backend/diag-cursos.js && docker exec chat-academico-api-1 node /app/backend/diag-cursos.js; docker exec chat-academico-api-1 rm -f /app/backend/diag-cursos.js; rm -f /tmp/diag-cursos.js'
      - name: Consulta
        if: ${{ inputs.secao != 'cursos' && inputs.secao != 'erros' }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes backend/scripts/diag-dados.js root@"$VPS_HOST":/tmp/diag-dados.js
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$VPS_HOST" 'docker cp /tmp/diag-dados.js chat-academico-api-1:/app/backend/diag-dados.js && docker exec chat-academico-api-1 node /app/backend/diag-dados.js; docker exec chat-academico-api-1 rm -f /app/backend/diag-dados.js'

      - name: Motivos de parada da leitura das conversas (só códigos, 24 h)
        if: ${{ inputs.secao == 'tudo' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$VPS_HOST" 'docker logs --since 24h chat-academico-api-1 2>&1 | grep -oE "Leituras[^(]*\([a-z_]+\)" | tail -8'
      # repositório público: os logs do WhatsApp podem trazer números de telefone; só quando pedido de propósito
      - name: Logs do WhatsApp (pilha completa do navegador, READY, mensagens)
        if: ${{ inputs.secao == 'logs' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$VPS_HOST" 'echo "== varredura de tarefas e conversas =="; docker logs --since 90m chat-academico-api-1 2>&1 | grep -iE "sweep|redistribute|unreachable" | cut -c1-500 | tail -15; docker logs --since 90m chat-academico-api-1 2>&1 | grep -E "Media|media|READY|Session|Starting WhatsApp|heartbeat|inject|inje|health|waiting for|Waiting failed|ProtocolError|Execution context|Target closed|message_create|Evaluation failed|watchdog|caught up|syncing|Error on whatsapp|Error sync|recuper" | cut -c1-700 | tail -40; echo "== pilha completa do primeiro TimeoutError =="; docker logs --since 90m chat-academico-api-1 2>&1 | grep -m1 -A22 "Waiting failed" | cut -c1-400; echo "== versao do whatsapp-web.js e do navegador =="; docker exec chat-academico-api-1 sh -c "grep -m1 \"\\\"version\\\"\" node_modules/whatsapp-web.js/package.json; chromium --version 2>/dev/null || chromium-browser --version 2>/dev/null"'
      # só as linhas de erro da última hora, com qualquer sequência de 6+ dígitos trocada por # (repositório público)
      - name: Erros recentes da API (números mascarados)
        if: ${{ inputs.secao == 'erros' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$VPS_HOST" 'docker logs --since 60m chat-academico-api-1 2>&1 | grep -iE -A6 "ERROR|logout|Unhandled|whatsappsession" | sed -E "s/[0-9]{6,}/#/g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/@/g" | cut -c1-300 | tail -80'
