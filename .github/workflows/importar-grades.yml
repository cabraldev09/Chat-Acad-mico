name: Importar as grades padrão no servidor

# Publica no servidor todas as grades curriculares que vêm com o sistema (backend/data/grades), como o botão "Importar grades
# padrão": cria as novas, atualiza as existentes e mostra quantas de cada.
on:
  workflow_dispatch:

jobs:
  importar:
    runs-on: ubuntu-latest
    env:
      # the server's address is the first column of deploy/vps/known_hosts (changing server = changing that one line)
      VPS_KNOWN_HOSTS: deploy/vps/known_hosts
    steps:
      - uses: actions/checkout@v4
      - name: Prepara o SSH e confere a identidade do servidor
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          VPS_HOST=$(grep -v '^#' "$VPS_KNOWN_HOSTS" | awk 'NF{print $1; exit}'); echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          body=$(printf '%s' "$KEY" | grep -v '^-----' | tr -d ' \r\n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s' "$body" | fold -w 70; echo; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          grep -v '^#' deploy/vps/known_hosts > ~/.ssh/known_hosts
          want=$(awk '{print $3}' ~/.ssh/known_hosts)
          seen=$(ssh-keyscan -T 15 -t ed25519 "$VPS_HOST" 2>/dev/null | awk '$2=="ssh-ed25519"{print $3}')
          [ -n "$seen" ] && [ "$seen" = "$want" ] || { echo "::error::A chave do servidor não confere"; exit 1; }
      - name: Importa
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes backend/scripts/importar-grades.js root@"$VPS_HOST":/tmp/importar-grades.js
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$VPS_HOST" "docker cp /tmp/importar-grades.js chat-academico-api-1:/app/backend/importar-grades.js && docker exec chat-academico-api-1 node /app/backend/importar-grades.js; s=\$?; docker exec chat-academico-api-1 rm -f /app/backend/importar-grades.js; exit \$s"
